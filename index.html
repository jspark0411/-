<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>업무노트</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#18181b"><link rel="apple-touch-icon" href="icon.svg"><style>

lor:var(--mut);font-size:11px;font-weight:900}.day{position:relative;min-height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#111;text-align:left;padding:4px}.day.out{opacity:.35}.day.sel{outline:3px solid var(--dark);outline-offset:-3px}.num{font-size:12px;font-weight:900}.dot{position:absolute;right:3px;top:3px;min-width:16px;height:16px;border-radius:99px;background:var(--red);color:#fff;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 4px}.fold{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px dashed var(--line);border-radius:16px;padding:10px;color:var(--mut);font-size:13px;font-weight:800}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.sum{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px}.sum small{display:block;color:var(--mut);font-weight:900}.sum b{font-size:16px}.listTitle{display:flex;justify-content:space-between;align-items:center;margin:2px 0 9px}.listTitle h2{margin:0;font-size:19px}.listTitle span{font-size:13px;color:var(--mut);font-weight:800}.task,.procCard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px}.taskTitle{font-size:16px;font-weight:900;margin:7px 0 4px}.meta{font-size:13px;color:var(--mut);line-height:1.5}.badge{display:inline-flex;padding:5px 10px;border-radius:99px;background:#f4f4f5;color:#52525b;font-size:12px;font-weight:900}.badge.g{background:var(--greenBg);color:var(--green)}.badge.b{background:var(--blueBg);color:var(--blue)}.tag{display:inline-flex;padding:4px 8px;border-radius:99px;background:#f4f4f5;color:#52525b;font-size:11px;font-weight:900;margin:6px 5px 0 0}.progTxt{text-align:right;font-size:12px;color:var(--mut);font-weight:900}.bar{height:8px;background:#e4e4e7;border-radius:99px;overflow:hidden}.bar div{height:100%;background:#18181b}.taskTop{display:flex;justify-content:space-between;gap:12px;align-items:center}.prog{min-width:105px}.controls{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center}.controls h3{grid-column:1/-1;margin:0;font-size:16px}.empty{text-align:center;color:var(--mut);padding:28px 12px}.detailTitle{font-size:23px;font-weight:900;margin:8px 0}.memo,.content{white-space:pre-wrap;background:#f4f4f5;border-radius:16px;padding:12px;margin-top:10px;color:#3f3f46;font-size:14px;line-height:1.6}.check{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:9px}.check.done{background:#ecfdf5;border-color:#bbf7d0}.check.na{background:#f4f4f5;border-color:#d4d4d8}.checkRow{display:flex;gap:12px;align-items:flex-start}.state{min-width:44px;height:28px;border-radius:99px;border:1px solid #a1a1aa;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#71717a}.check.done .state{background:#22c55e;border-color:#22c55e;color:#fff}.check.na .state{background:#71717a;border-color:#71717a;color:#fff}.ct{font-weight:900}.cd{font-size:13px;color:#71717a;margin-top:4px}.checkBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-left:56px}.checkBtns button{background:#fff;color:#3f3f46;border:1px solid var(--line);padding:9px}.checkBtns button.sel.d{background:#22c55e;color:#fff;border-color:#22c55e}.checkBtns button.sel.n{background:#71717a;color:#fff;border-color:#71717a}.modalBg{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.42);padding:16px;align-items:center;justify-content:center}.modalBg.show{display:flex}.modal{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#fff;border-radius:26px;padding:22px}.modal h2{margin:0 0 12px}.form{display:grid;gap:10px}.opts{display:grid;gap:8px;background:#fafafa;border:1px solid var(--line);border-radius:18px;padding:12px}.opt{display:flex;gap:9px;align-items:center;font-size:14px;font-weight:800;color:#3f3f46}.opt input{width:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.actions.three{grid-template-columns:repeat(3,1fr)}.procPick{max-height:210px;overflow:auto}.procItem{display:flex;gap:8px;border-bottom:1px solid #eee;padding:8px 0}.procItem input{width:auto;margin-top:3px}@media(max-width:760px){.app{padding:9px}.taskTop{flex-direction:column;align-items:flex-start}.prog{width:100%}.controls{grid-template-columns:1fr}.actions,.actions.three{grid-template-columns:1fr}.checkBtns{padding-left:0}.head h1{font-size:22px}}
</style></head><body><div id="app" class="app"></div>
<div id="taskModal" class="modalBg"><div class="modal"><h2 id="taskModalTitle">작업 추가</h2><div class="form"><label><span class="label">날짜</span><input id="fDate" type="date"></label><label><span class="label">장비 종류</span><select id="fType" onchange="renderProcChoices()"></select></label><label><span class="label">장비명</span><input id="fTool" placeholder="예: ACT-01"></label><label><span class="label">작업명</span><input id="fWork" placeholder="예: Soft Ver. Up"></label><div><span class="label">작업 옵션</span><div class="opts"><label class="opt"><input id="fRemain" type="checkbox">잔건 작업</label><label class="opt"><input id="fSoft" type="checkbox">Soft Ver. Up</label><label class="opt"><input id="fPass" type="checkbox">반출입증 필요</label></div></div><div><span class="label">수순서 선택</span><div class="opts"><label class="opt"><input id="fAllProc" type="checkbox" onchange="renderProcChoices()">다른 장비 수순서도 함께 보기</label><div id="procChoices" class="procPick"></div></div></div><label><span class="label">메모</span><textarea id="fMemo"></textarea></label></div><div class="actions"><button onclick="saveTask()">저장</button><button class="sec" onclick="closeTaskModal()">취소</button></div></div></div>
<div id="procModal" class="modalBg"><div class="modal"><h2 id="procModalTitle">수순서 등록</h2><div class="form"><label><span class="label">수순서 제목</span><input id="pTitle"></label><div><span class="label">적용 장비 종류</span><div id="pTypes" class="opts"></div></div><label><span class="label">수순서 내용</span><textarea id="pContent"></textarea></label></div><div class="actions"><button onclick="saveProc()">저장</button><button class="sec" onclick="closeProcModal()">취소</button></div></div></div>
<div id="doneModal" class="modalBg"><div class="modal"><h2>모든 항목이 완료되었습니다.</h2><p style="color:#52525b">이 작업을 어떻게 처리할까요?</p><div class="actions three"><button onclick="markDone()">완료 처리</button><button class="danger" onclick="deleteSelected()">삭제</button><button class="sec" onclick="closeDoneModal()">취소</button></div></div></div>
<script>
const KEY="worknote-v10";const TYPES=["ACT","LITHIUS","Pro","V","Z","AP","3G","DICE"];const B=[["b1","허가서 업로드","작업 허가서 업로드 완료 확인"],["b2","기본 서류 준비","KYM 시트, 이것만은 반드시 지킵니다 시트, 온콜라벨, 작업보고서"],["b3","작업수순서·도면·관련 자료 출력","작업에 필요한 자료 출력 완료 확인"],["b4","Spec 확인","작업 전 기준 Spec 확인"],["b5","Tool 위치 확인","필요한 Tool 위치 확인"]].map(x=>({id:x[0],title:x[1],desc:x[2]}));const BO={pass:[{id:"bPass",title:"반출입증 준비",desc:"반출입 필요 시 반출입 신청, 승인 확인, 반출입증 출력"}],soft:[{id:"b7",title:"고객 메일 송부",desc:"Soft Ver. Up 시 고객 메일 송부"}]};const A=[["a1","고객 청구시간 확인","작업 후 청구 가능 시간 확인"],["a2","Tool 위치 변경 시 인폼","Tool 위치가 변경된 경우 관련자에게 공유"],["a3","Work Order 작성","작업 완료 후 Work Order 작성"]].map(x=>({id:x[0],title:x[1],desc:x[2]}));const AO={remain:[{id:"aRemain",title:"잔건 처리",desc:"잔건 작업 시 잔건 시트, CT 홈페이지, TSR 승인, WISDOM 처리"}],soft:[{id:"aInfo",title:"Inform 메일",desc:"Soft Ver. Up 시 Inform 메일 송부"},{id:"aPara",title:"Para Compare",desc:"Soft Ver. Up 시 Para Compare 수행"}]};const ALL=[...B,...BO.pass,...BO.soft,...A,...AO.remain,...AO.soft];let tasks=[],procs=[],view="tasks",tab="before",selected=null,editTask=null,editProc=null,selDate=null,dateOn=false,calY=new Date().getFullYear(),calM=new Date().getMonth(),calFold=false,search="",showDone=false;const $=id=>document.getElementById(id);function today(){let d=new Date();return ds(d)}function ds(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function esc(s){return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function title(tool,work){return tool?`[${tool}] ${work||"이름 없는 작업"}`:(work||"이름 없는 작업")}function empty(){let r={};ALL.forEach(i=>r[i.id]="pending");return r}function load(){try{let d=JSON.parse(localStorage.getItem(KEY)||"{}");tasks=(d.tasks||[]).map(nt);procs=(d.procs||[]).map(np)}catch(e){tasks=[];procs=[]}}function save(){localStorage.setItem(KEY,JSON.stringify({tasks,procs}))}function nc(c){let r=empty();Object.keys(c||{}).forEach(k=>r[k]=c[k]===true?"done":c[k]===false?"pending":(["done","na"].includes(c[k])?c[k]:"pending"));return r}function nt(t){let flags={remain:!!t.flags?.remain,soft:!!t.flags?.soft,pass:!!(t.flags?.pass||t.flags?.parts)};return {...t,type:t.type||"ACT",tool:t.tool||"",work:t.work||t.workName||"",title:title(t.tool,t.work||t.workName||t.title),flags,procIds:t.procIds||t.procedureIds||[],checks:nc(t.checks),status:t.status||"active",createdAt:t.createdAt||new Date().toISOString()}}function np(p){return {...p,id:p.id||uid(),title:p.title||"이름 없는 수순서",types:p.types||p.toolTypes||[],content:p.content||"",updatedAt:p.updatedAt||p.createdAt||new Date().toISOString(),createdAt:p.createdAt||new Date().toISOString()}}function before(t){let x=[...B];if(t.flags.pass)x.push(...BO.pass);if(t.flags.soft)x.push(...BO.soft);return x}function after(t){let x=[...A];if(t.flags.remain)x.push(...AO.remain);if(t.flags.soft)x.push(...AO.soft);return x}function items(t){return[...before(t),...after(t)]}function ok(t,i){return["done","na"].includes(t.checks?.[i.id])}function prog(t,it=items(t)){let total=it.length,done=it.filter(i=>ok(t,i)).length;return{done,total,p:total?Math.round(done/total*100):0}}function complete(t){let p=prog(t);return p.total&&p.done===p.total}function unfinished(t){return t.status!=="done"&&!complete(t)}function badge(t){let p=prog(t);if(t.status==="done")return'<span class="badge g">완료</span>';if(p.done===p.total)return'<span class="badge g">전체 체크됨</span>';if(p.done>0)return'<span class="badge b">진행중</span>';return'<span class="badge">미완료</span>'}function header(name){return `<div class="head"><div class="row"><div><small>업무노트</small><h1>${name}</h1><p>작업 체크리스트와 수순서를 한 곳에서 관리합니다.</p></div>${view==="tasks"?'<button onclick="openTaskModal()">+ 작업 추가</button>':'<button onclick="openProcModal()">+ 수순서 등록</button>'}</div></div><div class="menu"><button class="${view==="tasks"?"on":""}" onclick="setView('tasks')">작업 체크리스트</button><button class="${view==="procs"?"on":""}" onclick="setView('procs')">수순서</button></div>`}function setView(v){view=v;selected=null;history.replaceState({screen:"main"},"","#");render()}function render(){let app=$("app");if(selected){let t=tasks.find(x=>x.id===selected);if(!t){selected=null;return render()}return detail(app,t)}if(view==="procs")return procPage(app);taskPage(app)}function sortTasks(a,b){let ad=a.status==="done"||complete(a),bd=b.status==="done"||complete(b);if(ad!==bd)return ad?1:-1;let d=new Date(a.date)-new Date(b.date);if(d!==0)return d;return new Date(a.createdAt)-new Date(b.createdAt)}function taskPage(app){let kw=search.trim().toLowerCase();let vis=tasks.filter(t=>!dateOn||t.date===selDate).filter(t=>showDone||t.status!=="done").filter(t=>!kw||[t.title,t.tool,t.work,t.type,t.memo].some(v=>String(v||"").toLowerCase().includes(kw))).sort(sortTasks);let base=dateOn?tasks.filter(t=>t.date===selDate):tasks,rem=base.filter(unfinished).length;app.innerHTML=header("작업 체크리스트")+cal()+`<div class="summary"><div class="sum"><small>표시 범위</small><b>${dateOn?selDate:"전체"}</b></div><div class="sum"><small>총 작업</small><b>${base.length}건</b></div><div class="sum"><small>남은 작업</small><b>${rem}건</b></div></div><div class="listTitle"><h2>${dateOn?selDate+" 작업":"전체 작업 목록"}</h2><span>${vis.length}건</span></div>${vis.length?vis.map(card).join(""):'<div class="card empty"><b>표시할 작업이 없습니다.</b><br>작업 추가 버튼으로 등록하세요.</div>'}<div class="card controls"><h3>작업 검색 / 필터</h3><input placeholder="작업명, 장비명, 장비 종류 검색" value="${esc(search)}" oninput="search=this.value;render()"><label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" ${showDone?"checked":""} onchange="showDone=this.checked;render()" style="width:auto">완료된 작업도 표시</label><button class="sec" onclick="clearDate()">전체 보기</button><button class="sec" onclick="deleteAll()">전체 삭제</button></div>`}function card(t){let p=prog(t);return `<div class="task" onclick="openTask('${t.id}')"><div class="taskTop"><div><div>${badge(t)} <span style="font-size:12px;color:#71717a;font-weight:900">${p.done}/${p.total}</span></div><div class="taskTitle">${esc(t.title)}</div><div class="meta">${esc(t.date)} · 장비 종류: ${esc(t.type)} · 작업명: ${esc(t.work||"미입력")}</div>${tags(t)}</div><div class="prog"><div class="progTxt">${p.p}%</div><div class="bar"><div style="width:${p.p}%"></div></div></div></div></div>`}function tags(t){let a=[];if(t.flags.remain)a.push("잔건");if(t.flags.soft)a.push("Soft Ver. Up");if(t.flags.pass)a.push("반출입증");if(t.procIds.length)a.push(`수순서 ${t.procIds.length}`);return a.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}function cal(){let title=`${calY}년 ${calM+1}월`;if(calFold)return `<div class="card cal"><div class="calHead"><div class="calTitle">${title}</div><div class="calNav"><button class="sec" onclick="toggleCal()">달력 펼치기</button></div></div><div class="fold"><span>${dateOn?"선택 날짜: "+selDate:"전체 작업 표시 중"}</span><button class="sec" onclick="clearDate()">전체 보기</button></div></div>`;let first=new Date(calY,calM,1),start=new Date(calY,calM,1-first.getDay()),w=["일","월","화","수","목","금","토"],cells=[];for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let s=ds(d),remain=tasks.filter(t=>t.date===s).filter(unfinished).length;cells.push(`<button class="day ${d.getMonth()===calM?"":"out"} ${dateOn&&s===selDate?"sel":""}" onclick="pickDate('${s}')"><span class="num">${d.getDate()}</span>${remain?`<span class="dot">${remain}</span>`:""}</button>`)}return `<div class="card cal"><div class="calHead"><div class="calTitle">${title}</div><div class="calNav"><button class="sec" onclick="moveM(-1)">‹</button><button class="sec" onclick="goToday()">오늘</button><button class="sec" onclick="moveM(1)">›</button><button class="sec" onclick="toggleCal()">접기</button></div></div><div class="week">${w.map(x=>`<div>${x}</div>`).join("")}</div><div class="grid">${cells.join("")}</div><p style="font-size:12px;color:#71717a;margin:8px 0 0">빨간 숫자는 완료되지 않은 작업 개수입니다.</p></div>`}function detail(app,t){let p=prog(t),bp=prog(t,before(t)),ap=prog(t,after(t));app.innerHTML=header("작업 상세")+`<button class="sec" onclick="goList()" style="margin-bottom:10px">← 작업 리스트로</button><div class="card"><div class="row"><div><div>${badge(t)} <span class="meta">${esc(t.date)}</span></div><div class="detailTitle">${esc(t.title)}</div><div class="meta">장비 종류: ${esc(t.type)} · 장비명: ${esc(t.tool||"미입력")} · 작업명: ${esc(t.work||"미입력")}</div>${tags(t)}${t.memo?`<div class="memo">${esc(t.memo)}</div>`:""}</div><div style="display:flex;gap:8px"><button onclick="openTaskModal('${t.id}')">수정</button><button class="danger" onclick="deleteTask('${t.id}')">삭제</button></div></div><div style="margin-top:14px"><div class="row" style="font-size:14px;color:#52525b;font-weight:900"><span>전체 진행률</span><span>${p.done}/${p.total} · ${p.p}%</span></div><div class="bar" style="height:12px"><div style="width:${p.p}%"></div></div></div></div><div class="tabs"><button class="${tab==="before"?"on":""}" onclick="tab='before';render()">작업 전 ${bp.done}/${bp.total}</button><button class="${tab==="after"?"on":""}" onclick="tab='after';render()">작업 후 ${ap.done}/${ap.total}</button><button class="${tab==="procedures"?"on":""}" onclick="tab='procedures';render()">수순서</button></div>${tab==="before"?checks(t,before(t)):tab==="after"?checks(t,after(t)):taskProcs(t)}`}function checks(t,it){return it.map((i,n)=>check(t,i,n+1)).join("")}function check(t,i,n){let s=t.checks[i.id]||"pending",cls=s==="done"?"done":s==="na"?"na":"",txt=s==="done"?"완료":s==="na"?"N/A":"미완료";return `<div class="check ${cls}"><div class="checkRow"><span class="state">${txt}</span><span><div class="ct">${n}. ${esc(i.title)}</div><div class="cd">${esc(i.desc)}</div></span></div><div class="checkBtns"><button class="d ${s==="done"?"sel":""}" onclick="setState('${i.id}','done')">완료</button><button class="n ${s==="na"?"sel":""}" onclick="setState('${i.id}','na')">해당 없음</button></div></div>`}function taskProcs(t){let list=t.procIds.map(id=>procs.find(p=>p.id===id)).filter(Boolean);return list.length?list.map(p=>`<div class="card"><h2 style="font-size:18px;margin:0 0 6px">[${esc(p.types.join(", "))}] ${esc(p.title)}</h2><div class="content">${esc(p.content)}</div></div>`).join(""):'<div class="card empty"><b>선택된 수순서가 없습니다.</b><br>작업 생성 시 수순서를 선택할 수 있습니다.</div>'}function procPage(app){app.innerHTML=header("수순서")+`<div class="listTitle"><h2>등록된 수순서</h2><span>${procs.length}건</span></div>${procs.length?procs.slice().sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)).map(p=>`<div class="procCard" onclick="viewProc('${p.id}')"><div class="taskTitle">[${esc(p.types.join(", ")||"미지정")}] ${esc(p.title)}</div><div class="meta">${esc(p.content.slice(0,90))}${p.content.length>90?"...":""}</div></div>`).join(""):'<div class="card empty"><b>등록된 수순서가 없습니다.</b><br>상단의 + 수순서 등록 버튼으로 추가하세요.</div>'}`}function viewProc(id){let p=procs.find(x=>x.id===id);if(!p)return;$("app").innerHTML=header("수순서 상세")+`<button class="sec" onclick="render()" style="margin-bottom:10px">← 목록으로</button><div class="card"><h2 style="margin:0 0 8px">[${esc(p.types.join(", ")||"미지정")}] ${esc(p.title)}</h2><div class="content">${esc(p.content)}</div><div class="actions"><button onclick="openProcModal('${p.id}')">수정</button><button class="danger" onclick="deleteProc('${p.id}')">삭제</button></div></div>`}function openTask(id){selected=id;tab="before";history.pushState({screen:"detail",id},"","#task-"+id);render()}function goList(){selected=null;history.replaceState({screen:"main"},"","#");render()}function anyModalOpen(){return ["taskModal","procModal","doneModal"].some(id=>$(id)?.classList.contains("show"))}
